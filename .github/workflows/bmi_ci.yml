name: BMI_CI                                        # "BMI_CI" workflow, name is optional

env:
  AZURE_WEBAPP_NAME: bmi202620260925161550                    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: 'bmi2021\published'        # set this to the path to your web app project
  ACTIONS_STEP_DEBUG: true
  CONFIGURATION: Release
  WORKING_DIRECTORY: bmi2021


on:
 workflow_dispatch:                                #  workflow_dispatch for manually triggered
 push:                                             
   branches: [ master ]
 

jobs:
  build:                                            # "build" job
    runs-on: windows-latest                         # runner
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build for Release
      run: dotnet build --configuration Release
    - name: Run unit tests
      run: dotnet test bmiUnitTestProject/bmiUnitTestProject.csproj --no-restore --collect "Code coverage" -l:trx
   
    - name: Publish Unit Test Results
      uses: dorny/test-reporter@v3
      with:
        artifact: ''
        name: MS Tests                  
        path: '**.trx'
        reporter: 'dotnet-trx'                     

    - name: Publish
      #run: dotnet publish -c Release --property:PublishDir=${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
      

# Deploy to Azure Web apps
    - name: Run Azure webapp deploy action using publish profile credentials
      uses: azure/webapps-deploy@v2
      with: 
        app-name: ${{ env.AZURE_WEBAPP_NAME }}                        # your app name. environment variable, not a secret. here it is defined above, no need to do in settings.
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE  }} # Define secret variable in repository settings as per action documentation/ # entire file put in for now.
        package: '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}' 
       


